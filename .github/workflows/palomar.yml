name: Palomar verification

on:
  push:
    branches: [Palomar]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Check submitted sources and metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install preflight dependency
        run: python3 -m pip install PyYAML==6.0.2
      - name: Check submitted sources and metadata
        run: python3 scripts/check-palomar.py

  palomar-preflight:
    name: Palomar mechanical preflight
    needs: verify
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@7a08c1da8e0558d330b9b3c244896c175d373303
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 7a08c1da8e0558d330b9b3c244896c175d373303
      request_id: preflight001
      mode: full
      # Use the public GitHub-hosted profile rather than Palomar's private runners.
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"comparator.json","authorization_relationship":"I am a responsible author or maintainer"}'

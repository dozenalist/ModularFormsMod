name = "ModularFormsMod"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["ModularFormsMod", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "LeanModularForms"
path = "vendor/LeanModularForms"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "c55e6e786f49471c72fbddbec5415808896aec1e"

[[lean_lib]]
name = "ModularFormsMod"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
